# docker-compose.yml
# Configuración de desarrollo para C4A SaaS

version: '3.8'

services:
  # Base de datos PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: c4a_postgres
    environment:
      POSTGRES_DB: c4a_saas
      POSTGRES_USER: c4a_user
      POSTGRES_PASSWORD: c4a_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=es_CL.UTF-8 --lc-ctype=es_CL.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - c4a_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U c4a_user -d c4a_saas"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis para caché y sesiones
  redis:
    image: redis:7-alpine
    container_name: c4a_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - c4a_network
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend FastAPI
  backend:
    build:
      context: ./aplicaciones/backend
      dockerfile: Dockerfile
    container_name: c4a_backend
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - DATABASE_URL=postgresql+asyncpg://c4a_user:c4a_password@db:5432/c4a_saas
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=your-super-secret-jwt-key-change-in-production
      - JWT_ALGORITHM=RS256
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=30
      - JWT_REFRESH_TOKEN_EXPIRE_DAYS=7
      - CORS_ORIGINS=http://localhost:3000,http://localhost:3001
      - STRIPE_PUBLISHABLE_KEY=pk_test_your_stripe_key
      - STRIPE_SECRET_KEY=sk_test_your_stripe_secret
      - STRIPE_WEBHOOK_SECRET=whsec_your_webhook_secret
      - EMAIL_HOST=smtp.gmail.com
      - EMAIL_PORT=587
      - EMAIL_USERNAME=your-email@gmail.com
      - EMAIL_PASSWORD=your-app-password
      - TELEMETRY_ENABLED=false
      - LOG_LEVEL=INFO
    ports:
      - "8000:8000"
    volumes:
      - ./aplicaciones/backend:/app
      - /app/__pycache__
      - /app/.pytest_cache
      - ./uploads:/app/uploads
      - ./reportes:/app/reportes
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - c4a_network
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --log-level info

  # Frontend React
  frontend:
    build:
      context: ./aplicaciones/frontend
      dockerfile: Dockerfile
    container_name: c4a_frontend
    environment:
      - REACT_APP_API_URL=http://localhost:8000
      - REACT_APP_STRIPE_PUBLISHABLE_KEY=pk_test_your_stripe_key
      - REACT_APP_ENVIRONMENT=development
      - CHOKIDAR_USEPOLLING=true
    ports:
      - "3000:3000"
    volumes:
      - ./aplicaciones/frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - c4a_network
    restart: unless-stopped
    command: npm run dev

  # Nginx como proxy reverso
  nginx:
    image: nginx:alpine
    container_name: c4a_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx:/etc/nginx
    depends_on:
      - backend
      - frontend
    networks:
      - c4a_network
    restart: unless-stopped
    profiles:
      - production

  # Servicio de monitoreo (opcional)
  prometheus:
    image: prom/prometheus:latest
    container_name: c4a_prometheus
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
    networks:
      - c4a_network
    restart: unless-stopped
    profiles:
      - monitoring

  # Grafana para visualización (opcional)
  grafana:
    image: grafana/grafana:latest
    container_name: c4a_grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - c4a_network
    restart: unless-stopped
    profiles:
      - monitoring

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  c4a_network:
    driver: bridge